<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Annotation</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #1e1e1e;
    color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 4px 0 12px; }
  #stage {
    display: inline-block;
    position: relative;
    line-height: 0;
  }
  #shot {
    display: block;
    max-width: 90vw;
    max-height: 80vh;
    cursor: crosshair;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* Red crosshair, 20px, centered on the click point */
  #marker {
    position: absolute;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
  }
  #marker::before, #marker::after {
    content: "";
    position: absolute;
    background: red;
    box-shadow: 0 0 0 1px #fff;
  }
  #marker::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #marker::after  { top: 9px; left: 0; height: 2px; width: 20px; }

  #controls {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }
  #controls label { font-size: 0.95rem; }
  #name {
    font-size: 1rem;
    padding: 6px 10px;
    width: 240px;
    border-radius: 4px;
    border: 1px solid #555;
    background: #2b2b2b;
    color: #fff;
  }
  button {
    font-size: 0.95rem;
    padding: 6px 16px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #save { background: #2e7d32; color: #fff; }
  #cancel { background: #555; color: #fff; }
  #status {
    margin-top: 12px;
    min-height: 1.4em;
    font-size: 0.95rem;
  }
  #status.ok { color: #7bd88f; }
  #status.error { color: #ff7b7b; }
  #hint { margin-top: 6px; font-size: 0.85rem; color: #999; }
</style>
</head>
<body>
  <h1 id="title">Click a button, then name it</h1>

  <div id="stage">
    <img id="shot" src="/image" alt="Image to annotate">
    <div id="marker"></div>
  </div>

  <div id="controls">
    <label for="name">What should this button be named?</label>
    <input id="name" type="text" maxlength="50" placeholder="e.g. gemini" autocomplete="off">
    <button id="save" type="button" disabled>Save</button>
    <button id="cancel" type="button">Cancel</button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="hint">Click elsewhere on the image to move the marker.</div>

<script>
(function () {
  "use strict";

  const CROP_SIZE = 50;
  const NAME_PATTERN = /^[A-Za-z0-9 ]+$/;
  const MAX_NAME = 50;

  const img = document.getElementById("shot");
  const marker = document.getElementById("marker");
  const nameInput = document.getElementById("name");
  const saveBtn = document.getElementById("save");
  const cancelBtn = document.getElementById("cancel");
  const statusEl = document.getElementById("status");

  let point = null;   // {x_pct, y_pct} as 0.0-1.0 fractions of the image
  let finished = false;

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = kind || "";
  }

  function clamp01(v) {
    return Math.min(1, Math.max(0, v));
  }

  function round4(v) {
    return Math.round(v * 10000) / 10000;
  }

  img.addEventListener("error", function () {
    setStatus("Could not load the image from the CLI.", "error");
  });

  img.addEventListener("click", function (e) {
    if (finished) return;
    const r = img.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    const x = clamp01((e.clientX - r.left) / r.width);
    const y = clamp01((e.clientY - r.top) / r.height);

    point = { x_pct: round4(x), y_pct: round4(y) };
    marker.style.left = (x * 100) + "%";
    marker.style.top = (y * 100) + "%";
    marker.style.display = "block";
    saveBtn.disabled = false;
    setStatus(
      "Marked at (" + (x * 100).toFixed(1) + "%, " + (y * 100).toFixed(1) + "%). Enter a name and click Save.",
      ""
    );
    nameInput.focus();
  });

  function validateName(raw) {
    const name = raw.trim().replace(/\s+/g, " ");
    if (!name) return { error: "Button name cannot be empty" };
    if (name.length > MAX_NAME) return { error: "Button name must be at most " + MAX_NAME + " characters" };
    if (!NAME_PATTERN.test(name)) return { error: "Use only letters, numbers and spaces" };
    return { name: name };
  }

  function setBusy(busy) {
    saveBtn.disabled = busy || !point;
    cancelBtn.disabled = busy;
    nameInput.disabled = busy;
  }

  function lockUI() {
    finished = true;
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    nameInput.disabled = true;
  }

  async function save() {
    if (finished || saveBtn.disabled) return;
    if (!point) {
      setStatus("Click on the image first.", "error");
      return;
    }
    const v = validateName(nameInput.value);
    if (v.error) {
      setStatus(v.error, "error");
      return;
    }

    setBusy(true);
    setStatus("Saving...", "");
    try {
      const res = await fetch("/save-template", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: v.name,
          x_pct: point.x_pct,
          y_pct: point.y_pct,
          crop_size: CROP_SIZE
        })
      });
      const data = await res.json().catch(function () { return {}; });

      if (data.status === "success") {
        lockUI();
        setStatus((data.message || "Template saved") + ". Closing in 2 seconds...", "ok");
        setTimeout(closeWindow, 2000);
      } else if (data.status === "declined") {
        setBusy(false);
        setStatus(data.message || "Not saved. Choose another name or click Cancel.", "error");
      } else {
        setBusy(false);
        setStatus(data.message || ("Save failed (HTTP " + res.status + ")"), "error");
      }
    } catch (err) {
      setBusy(false);
      setStatus("Could not reach the CLI: " + err.message, "error");
    }
  }

  async function cancel() {
    if (finished) return;
    lockUI();
    try {
      await fetch("/cancel", { method: "POST" });
    } catch (err) {
      // The CLI may already be gone; closing the page is still correct.
    }
    setStatus("Cancelled. You can close this tab.", "");
    setTimeout(closeWindow, 500);
  }

  function closeWindow() {
    window.close();
    setStatus("Done. You can close this tab.", statusEl.className);
  }

  saveBtn.addEventListener("click", save);
  cancelBtn.addEventListener("click", cancel);
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") save();
  });
})();
</script>
</body>
</html>
